<main class="min-h-screen bg-gray-100 flex flex-col p-6">
  
  <header class="mb-4 flex flex-row justify-between items-center">
    
    <div>
      <h1 class="text-xl sm:text-2xl font-bold text-gray-800 tracking-tight">Agenda YS</h1>
      <p class="text-xs sm:text-sm text-gray-500">Gestão de Horários</p>
    </div>
    
    <div class="flex items-center gap-2">
    <div class="relative">

      <button (click)="menuMesAberto = !menuMesAberto"
              class="flex items-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold rounded-full py-1.5 px-4 transition-colors shadow-sm outline-none focus:ring-2 focus:ring-rose-500">
        {{ nomeMesAtual }}
        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>


      @if (menuMesAberto) {
        <div class="absolute right-0 mt-2 w-36 bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden z-50">
          
          <div class="max-h-56 overflow-y-auto py-1">
            @for (mes of mesesDoAno; track mes.val) {
              <button (click)="mudarMesCustomizado(mes.val)"
                      [class.bg-rose-50]="mes.val === mesAtual"
                      [class.text-rose-600]="mes.val === mesAtual"
                      [class.font-bold]="mes.val === mesAtual"
                      class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                {{ mes.nome }}
              </button>
            }
          </div>

        </div>
      }
    </div>

    <button
      type="button"
      (click)="logOut()"
      class="bg-white hover:bg-gray-100 text-gray-700 text-sm font-semibold rounded-full py-1.5 px-4 transition-colors shadow-sm outline-none focus:ring-2 focus:ring-rose-500">
      Sair
    </button>
    </div>

  </header>

  <div class="bg-white p-4 sm:p-6 rounded-xl shadow-xl w-full max-w-[100vw] overflow-x-hidden mb-24">
    <full-calendar #calendario [options]="calendarOptions" class="w-full"></full-calendar>
  </div>

  
  <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] p-3 flex justify-center gap-2 sm:gap-4 z-50">
    
    
    <button (click)="mudarVisao('dayGridMonth')"
            [class.bg-rose-500]="visaoAtual === 'dayGridMonth'" [class.text-white]="visaoAtual === 'dayGridMonth'"
            [class.bg-gray-100]="visaoAtual !== 'dayGridMonth'" [class.text-gray-600]="visaoAtual !== 'dayGridMonth'"
            class="flex-1 max-w-[120px] py-2.5 rounded-full font-semibold text-sm transition-colors">
      Mês
    </button>

   
    <button (click)="mudarVisao(isMobile ? 'tresDias' : 'semanaDinamica')"
            [class.bg-rose-500]="visaoAtual === (isMobile ? 'tresDias' : 'semanaDinamica')" [class.text-white]="visaoAtual === (isMobile ? 'tresDias' : 'semanaDinamica')"
            [class.bg-gray-100]="visaoAtual !== (isMobile ? 'tresDias' : 'semanaDinamica')" [class.text-gray-600]="visaoAtual !== (isMobile ? 'tresDias' : 'semanaDinamica')"
            class="flex-1 max-w-[120px] py-2.5 rounded-full font-semibold text-sm transition-colors">
      Semana
    </button>

   
    <button (click)="mudarVisao('timeGridDay')"
            [class.bg-rose-500]="visaoAtual === 'timeGridDay'" [class.text-white]="visaoAtual === 'timeGridDay'"
            [class.bg-gray-100]="visaoAtual !== 'timeGridDay'" [class.text-gray-600]="visaoAtual !== 'timeGridDay'"
            class="flex-1 max-w-[120px] py-2.5 rounded-full font-semibold text-sm transition-colors">
      Dia
    </button>

  </div>

  @if (modalAberto()) {
    <app-modal-agendamento 
      [dataSelecionada]="dataParaOModal()" 
      [agendamento]="agendamentoEdicao()"
      [bloqueio]="bloqueioEdicao()"
      (fechar)="modalAberto.set(false)"
      (sucesso)="exibirAviso($event, 'sucesso'); carregarAgendamentos()"
      (erro)="exibirAviso($event, 'erro')">
    </app-modal-agendamento>
  }


  @if (mostrarAlerta()) {
    <div class="fixed top-6 left-1/2 -translate-x-1/2 z-[200] text-white px-5 py-3 rounded-full shadow-2xl font-medium text-sm flex items-center gap-2 w-max max-w-[90vw] transition-colors"
         [class.bg-emerald-600]="tipoAlerta() === 'sucesso'"
         [class.bg-gray-800]="tipoAlerta() === 'erro'">
      
      @if (tipoAlerta() === 'sucesso') {
        <svg class="w-5 h-5 text-white shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      } 
      @else {
        <svg class="w-5 h-5 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      }

      <span>{{ mensagemAlerta() }}</span>
    </div>
  }

</main>

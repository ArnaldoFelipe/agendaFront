<main class="min-h-screen bg-gray-100 flex items-center justify-center p-4">

  <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-2xl w-full max-w-md animate-fade-in-up">

    <div class="mb-6 text-center">
      <h1 class="text-xl sm:text-2xl font-bold text-gray-800 tracking-tight">Agenda YS</h1>
      <p class="text-sm text-gray-600 mt-1 font-medium">Entre para acessar sua agenda</p>
    </div>

    <form [formGroup]="formLogin" (ngSubmit)="login()">

      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1">E-mail</label>
        <input
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
          autocomplete="username"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all"
        >
      </div>

      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Senha</label>
        <input
          type="password"
          formControlName="senha"
          placeholder="••••••••"
          autocomplete="current-password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all"
        >
      </div>

      @if (erro) {
        <div class="mb-4 px-4 py-2 rounded-lg bg-rose-50 border border-rose-200 text-rose-600 text-sm font-medium">
          {{ erro }}
        </div>
      }

      <button
        type="submit"
        [disabled]="formLogin.invalid"
        class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-2.5 rounded-lg shadow-sm transition-colors disabled:bg-rose-300 disabled:cursor-not-allowed">
        Entrar
      </button>

    </form>

  </div>

</main>

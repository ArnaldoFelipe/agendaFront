<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4">
  <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md animate-fade-in-up">
    
    <h2 class="text-xl font-bold text-gray-800 mb-2">{{ agendamento ? 'Editar Agendamento' : 'Novo Agendamento' }}</h2>
    
    <p class="text-sm text-gray-600 mb-6 font-medium">
      Horário: <span class="text-rose-600">{{ dataSelecionada | date:'dd/MM/yyyy HH:mm' }}</span>
    </p>

    <form [formGroup]="formAgendamento" (ngSubmit)="salvar()">
      
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Nome da Cliente</label>
        <input 
          type="text" 
          formControlName="clienteNome" 
          placeholder="Ex: Maria Silva"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all"
        >
      </div>

      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1">WhatsApp</label>
        <input 
          type="tel" 
          formControlName="telefoneWpp"
          placeholder="(81) 99999-9999"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all"
        >
      </div>

      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Serviço <span class="text-gray-400 font-normal">(Opcional)</span></label>
        <input 
          type="text" 
          formControlName="servico" 
          placeholder="Ex: Manutenção, Alongamento"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all"
        >
      </div>

      <div>
        @if (confirmandoExclusao()) {
      <div class="mt-6 p-4 bg-rose-50 border border-rose-200 rounded-xl flex flex-col items-center gap-3 animate-fade-in-up">
        <span class="text-rose-800 font-semibold text-sm text-center">
          Tem certeza que deseja excluir o agendamento de <br> 
          <span class="font-bold text-rose-600">{{ agendamento?.clienteNome }}</span>?
        </span>
        <div class="flex gap-2 w-full mt-1">
          <button type="button" (click)="confirmandoExclusao.set(false)"
                  class="flex-1 bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 font-semibold py-2 px-4 rounded-lg text-sm transition-colors shadow-sm">
            Não
          </button>
          
          <button type="button" (click)="confirmarExclusao()"
                  class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition-colors shadow-sm">
            Sim
          </button>
        </div>
      </div>
    } @else {
      <div class="mt-6 flex justify-between items-center w-full">
        
        <div>
          @if (agendamento && agendamento.id) {
            <button type="button" (click)="iniciarExclusao()"
                    class="text-rose-500 hover:text-rose-700 hover:bg-rose-50 px-3 py-2 rounded-lg font-bold text-sm transition-colors flex items-center gap-1 outline-none focus:ring-2 focus:ring-rose-200">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
              Excluir
            </button>
          }
        </div>
      </div>
    }
      </div>
      
      <div class="flex justify-end gap-3 mt-8">
        <button 
          type="button" 
          (click)="fecharModal()" 
          class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-semibold transition-colors">
          Cancelar
        </button>
        
        <button 
          type="submit" 
          [disabled]="formAgendamento.invalid"
          class="px-4 py-2 text-white bg-rose-500 hover:bg-rose-600 rounded-lg font-semibold transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
          Salvar
        </button>
      </div>
    </form>
    
  </div>
</div>
